name: Deploy Koma

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve deployment settings
        id: deploy-meta
        run: |
          PROJECT_NAME="$(node -p "require('./package.json').name")"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "deploy_target=~/$PROJECT_NAME" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check deployment secrets
        id: deploy-secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SERVER_HOST or SERVER_PASSWORD is not configured; skipping remote deployment."
          fi

      - name: Deploy files to server
        if: steps.deploy-secrets.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/,dist-server/,package.json,package-lock.json"
          target: ${{ steps.deploy-meta.outputs.deploy_target }}
          strip_components: 0

      - name: Restart Koma with pm2
        if: steps.deploy-secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_PORT: "3010"
          ASR_PROVIDER: ${{ secrets.ASR_PROVIDER }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          ASR_BASE_URL: ${{ secrets.ASR_BASE_URL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASR_MODEL: ${{ secrets.ASR_MODEL }}
          VISION_PROVIDER: ${{ secrets.VISION_PROVIDER || secrets.ANALYSIS_PROVIDER }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          VISION_BASE_URL: ${{ secrets.VISION_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          DEMO_REQUESTS_PER_IP_PER_DAY: ${{ secrets.DEMO_REQUESTS_PER_IP_PER_DAY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 30m
          envs: APP_PORT,ASR_PROVIDER,ASR_API_KEY,ASR_BASE_URL,DASHSCOPE_API_KEY,GROQ_API_KEY,OPENAI_API_KEY,ASR_MODEL,VISION_PROVIDER,VISION_API_KEY,VISION_BASE_URL,GEMINI_API_KEY,OPENROUTER_API_KEY,VISION_MODEL,PUBLIC_BASE_URL,DEMO_REQUESTS_PER_IP_PER_DAY
          script: |
            set -e
            cd ${{ steps.deploy-meta.outputs.deploy_target }}
            npm install --omit=dev --no-audit --no-fund --prefer-offline
            cat > .env <<EOF
            PORT=${APP_PORT}
            ASR_PROVIDER=${ASR_PROVIDER}
            ASR_API_KEY=${ASR_API_KEY}
            ASR_BASE_URL=${ASR_BASE_URL}
            DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
            GROQ_API_KEY=${GROQ_API_KEY}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            ASR_MODEL=${ASR_MODEL}
            VISION_PROVIDER=${VISION_PROVIDER}
            VISION_API_KEY=${VISION_API_KEY}
            VISION_BASE_URL=${VISION_BASE_URL}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
            VISION_MODEL=${VISION_MODEL}
            PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
            DEMO_REQUESTS_PER_IP_PER_DAY=${DEMO_REQUESTS_PER_IP_PER_DAY}
            TRUST_PROXY=true
            EOF
            chmod 600 .env
            pm2 delete ding-frame 2>/dev/null || true
            pm2 delete koma 2>/dev/null || true
            pm2 start dist-server/index.js --name koma
            pm2 save
