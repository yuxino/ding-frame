name: Fix README logo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-readme-logo.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate transparent high-resolution README icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          src = Path('public/koma-icon.png')
          out = Path('public/koma-readme-icon.png')

          image = Image.open(src).convert('RGBA')
          w, h = image.size
          mask = Image.new('L', (w, h), 0)
          draw = ImageDraw.Draw(mask)
          draw.rounded_rectangle((0, 0, w - 1, h - 1), radius=round(min(w, h) * 0.28125), fill=255)
          image.putalpha(mask)
          image.save(out, 'PNG', optimize=True)

          for readme in (Path('README.md'), Path('README.zh-CN.md')):
              text = readme.read_text()
              text = text.replace('public/koma-readme-icon.svg', 'public/koma-readme-icon.png')
              readme.write_text(text)
          PY

      - name: Commit generated icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/koma-readme-icon.png README.md README.zh-CN.md
          git diff --cached --quiet && exit 0
          git commit -m "Use sharp README logo"
          git push
